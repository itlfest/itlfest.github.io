<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111c36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="呼出番号" />
    <title>お呼び出し番号 | 学園祭POS</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="voice-toggle" class="voice-toggle" type="button" aria-pressed="false">🔇 音声案内 OFF</button>
    <main class="board">
      <section class="column cooking"><h1>調理中</h1><div id="cooking-numbers" class="numbers"></div></section>
      <section class="column calling"><h1>お呼び出し中</h1><div id="calling-numbers" class="numbers"></div></section>
    </main>
    <p id="connection" class="connection">接続確認中</p>
    <script type="module" src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("../sw.js").catch((error) => {
            console.warn("Service Worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
